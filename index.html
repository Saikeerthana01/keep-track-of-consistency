<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Study Tracker Calendar</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    body {
        background-size: cover;
        background-position: center;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        padding-bottom: 50px;
        backdrop-filter: blur(2px);
    }

    /* Calendar container */
    #calendar {
        width: 380px;
        margin: 40px auto;
        background: rgba(255,255,255,0.88);
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 4px 14px rgba(0,0,0,0.2);
    }

    .calendar-grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 6px;
        margin-top: 15px;
    }

    .day {
        padding: 12px;
        background: #f1f1f1;
        border-radius: 6px;
        cursor: pointer;
        transition: 0.25s;
        font-weight: 600;
    }

    /* Style variations */
    .style-rounded .day {
        border-radius: 50%;
        padding: 14px;
    }

    .style-minimal .day {
        background: #ffffff;
        border: 1px solid #ddd;
    }

    .day:hover {
        transform: scale(1.05);
    }

    .green { background: #7bdc7b !important; }
    .red { background: #ff8c8c !important; }
    .contrast-green { background: #00ff00 !important; color: #000 !important; }
    .contrast-red { background: #ff0000 !important; color: #fff !important; }

    #analysisBox {
        background: white;
        padding: 15px;
        margin-top: 15px;
        border-radius: 8px;
        display: none;
    }
</style>

</head>
<body style="background-image: url('https://images.unsplash.com/photo-1519389950473-47ba0277781c');">

<div class="container text-center">

    <h2 class="mt-3 fw-bold">📘 Study Consistency Calendar</h2>

    <!-- Background Selection -->
    <div class="mt-4">
        <label class="fw-bold">Background Image:</label>
        <select id="bgSelect" class="form-select w-50 mx-auto">
    <option value="desk">Study Desk</option>
    <option value="mountain">Mountains</option>
    <option value="pastel">Pastel Study Room</option>
    <option value="plain">Plain White</option>
</select>

    </div>

    <!-- Style Selection -->
    <div class="mt-3">
        <label class="fw-bold">Calendar Style:</label>
        <select id="styleSelect" class="form-select w-50 mx-auto">
            <option value="default">Default</option>
            <option value="rounded">Rounded</option>
            <option value="minimal">Minimal</option>
        </select>
    </div>

    <!-- Calendar -->
    <div id="calendar" class="mt-4">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <button class="btn btn-outline-primary btn-sm" onclick="changeMonth(-1)">❮ Prev</button>
            <h4 id="monthYear"></h4>
            <button class="btn btn-outline-primary btn-sm" onclick="changeMonth(1)">Next ❯</button>
        </div>

        <div class="calendar-grid fw-bold">
            <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
        </div>

        <div id="days" class="calendar-grid"></div>

        <!-- Mark Buttons -->
        <div class="mt-3 d-flex gap-2 justify-content-center">
            <button class="btn btn-success" onclick="markDay('green')">Mark Green</button>
            <button class="btn btn-danger" onclick="markDay('red')">Mark Red</button>
            <button class="btn btn-light" onclick="clearDay()">Clear Day</button>

        </div>

        <!-- Monthly Analysis -->
        <button class="btn btn-warning mt-3 w-100" onclick="showAnalysis()">Show Monthly Analysis</button>

        <div id="analysisBox"></div>
    </div>
</div>

<script>
let selectedDay = null;
let currentDate = new Date();
let logs = JSON.parse(localStorage.getItem("studyLogs") || "{}");


// Backgrounds
const backgrounds = {
    desk: {
        url: "https://images.unsplash.com/photo-1524995997946-a1c2e315a42f",
        color: "#1a1a1a"
    },
    mountain: {
        url: "https://images.unsplash.com/photo-1501785888041-af3ef285b470",
        color: "#ffffff"
    },
    pastel: {
        url: "https://images.unsplash.com/photo-1522202176988-66273c2fd55f",
        color: "#2b2b2b"
    },
    plain: {
        url: "",
        color: "#000000"
    }
};

// Apply background + adjust heading color dynamically
document.getElementById("bgSelect").onchange = function () {
    const bg = backgrounds[this.value];

    if (bg.url === "") {
        document.body.style.backgroundImage = "";
    } else {
        document.body.style.backgroundImage = `url('${bg.url}')`;
    }

    // Change heading color automatically
    document.querySelector("h2").style.color = bg.color;
};

// ADD NEW OPTIONS TO THE DROPDOWN (update your HTML)
</script>


// Apply calendar style
<script>
document.getElementById("styleSelect").onchange = function() {
    const cal = document.getElementById("calendar");
    cal.classList.remove("style-rounded", "style-minimal");
    if (this.value === "rounded") cal.classList.add("style-rounded");
    else if (this.value === "minimal") cal.classList.add("style-minimal");
};

// Render Calendar
function renderCalendar() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    document.getElementById("monthYear").innerText =
        currentDate.toLocaleString("default", { month: "long" }) + " " + year;

    let firstDay = new Date(year, month, 1).getDay();
    let totalDays = new Date(year, month + 1, 0).getDate();
    let daysDiv = document.getElementById("days");

    daysDiv.innerHTML = "";
    for (let i = 0; i < firstDay; i++) {
        daysDiv.innerHTML += `<div></div>`;
    }

    for (let day = 1; day <= totalDays; day++) {
        let id = `${year}-${month + 1}-${day}`;
        let color = logs[id] || "";

        daysDiv.innerHTML += `<div class="day ${color}" onclick="selectDay('${id}', this)">${day}</div>`;
    }
}

function changeMonth(offset) {
    currentDate.setMonth(currentDate.getMonth() + offset);
    selectedDay = null;
    renderCalendar();
}

function selectDay(id, element) {
    selectedDay = { id, element };
}

function markDay(type) {
    if (!selectedDay) return alert("Select a day first!");

    let color = type === "green"
        ? (document.getElementById("styleSelect").value === "minimal" ? "contrast-green" : "green")
        : (document.getElementById("styleSelect").value === "minimal" ? "contrast-red" : "red");

    selectedDay.element.className = "day " + color;
    logs[selectedDay.id] = color;
    localStorage.setItem("studyLogs", JSON.stringify(logs));
}
function clearDay() {
    if (!selectedDay) return alert("Select a day first!");

    // Remove the color class
    selectedDay.element.className = "day";

    // Remove from localStorage
    delete logs[selectedDay.id];
    localStorage.setItem("studyLogs", JSON.stringify(logs));
}

function showAnalysis() {
    const month = currentDate.getMonth() + 1;
    const year = currentDate.getFullYear();

    let total = 0, green = 0, red = 0;

    for (let key in logs) {
        if (key.startsWith(`${year}-${month}-`)) {
            total++;
            if (logs[key].includes("green")) green++;
            if (logs[key].includes("red")) red++;
        }
    }

    let score = (green / total) * 100 || 0;

    let msg = score >= 60
        ? `Great job! You were ${Math.round(score)}% consistent 🎉`
        : `Keep going! Your consistency was ${Math.round(score)}%. You can improve 💪`;

    document.getElementById("analysisBox").innerHTML =
        `<h5>📊 Monthly Analysis</h5>
         <p><b>Green days:</b> ${green}</p>
         <p><b>Red days:</b> ${red}</p>
         <p><b>Consistency:</b> ${Math.round(score)}%</p>
         <p>${msg}</p>`;
    document.getElementById("analysisBox").style.display = "block";
}

renderCalendar();
</script>

</body>
</html>
